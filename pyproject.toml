[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apex-trading-agent"
version = "0.1.0"
description = "Deterministic crypto market analysis and paper-trading engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Apex Trading Agent" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6.0.2,<7",
  "typer>=0.12.3,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "types-PyYAML>=6.0.12,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
apex = "apex.cli_app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/apex"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/apex/cli_commands/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["apex"]

[tool.coverage.run]
source = ["apex"]
branch = true
