    liquidity: 0.09
    movement: 0.10
    acceleration: 0.11
    relative_volume: 0.13
    volatility_usability: 0.10
    entry_freshness: 0.14
    structure_proximity: 0.12
    directional_clarity: 0.08
    spread_quality: 0.05
    noise_quality: 0.08
