environment: development
log_level: INFO
data_dir: data
log_dir: logs
cache_enabled: true
futures_evidence_enabled: true
outcome_tracking_enabled: true
rollout_diagnostics_enabled: false
geometry_execution:
  # Conservative regular-user taker assumptions; update these for the account tier.
  # Runtime geometry also adds the worst observed ticker/order-book spread.
  enabled: true
  entry_fee_pct: 0.05
  exit_fee_pct: 0.05
  entry_slippage_pct: 0.02
  exit_slippage_pct: 0.02
methodology_gate_mode: enforce
futures_screener:
  minimum_quote_volume_24h: 5000000
  maximum_spread_percentage: 0.25
  minimum_absolute_movement_percentage: 0.0
  shortlist_size: 36
  ticker_prefilter_size: 120
  candle_timeframe: 5m
  candle_limit: 145
  minimum_candle_count: 72
  target_quote_volume_24h: 100000000
  target_movement_percentage: 8.0
  target_relative_volume: 2.0
  target_atr_percentage: 2.0
  maximum_usable_atr_percentage: 6.0
  maximum_extension_atr: 3.0
  weights:
    liquidity: 0.09
    movement: 0.10
    acceleration: 0.11
    relative_volume: 0.13
    volatility_usability: 0.10
    entry_freshness: 0.14
    structure_proximity: 0.12
    directional_clarity: 0.08
    spread_quality: 0.05
    noise_quality: 0.08
  quote_asset: USDT
  blacklist: []
  allowlist: null
  metadata_cache_ttl_seconds: 3600
market_environment:
  required_timeframes: [1m, 3m, 5m, 15m, 30m, 1h, 4h]
  timeframe_weights:
    1m: 0.05
    3m: 0.10
    5m: 0.15
    15m: 0.20
    30m: 0.20
    1h: 0.15
    4h: 0.15
  higher_timeframes: [4h, 1h]
  structure_timeframes: [30m, 15m]
  execution_priority: [3m, 5m, 15m, 30m, 1h, 4h]
  entry_priority: [1m, 3m, 5m, 15m]
  trend_strength_min: 0.55
  strong_trend_strength_min: 0.75
  relative_volume_expansion_min: 1.25
  relative_volume_extreme_min: 2.5
  volatility_compressed_max: 0.75
  volatility_expanding_min: 1.15
  volatility_extreme_min: 1.8
  retest_tolerance_atr: 0.35
  extension_moderate_atr: 1.25
  extension_overextended_atr: 2.0
  extension_extreme_atr: 3.0
  minimum_tradeability_score: 55.0
  maximum_tradeable_conflict_score: 60.0
  minimum_required_timeframes: 4
  maximum_missing_timeframes: 3
strategy_routing:
  enabled:
    - momentum_breakout
    - breakout_continuation
    - breakout_retest
    - first_pullback_continuation
    - trend_pullback
    - compression_expansion
    - range_reversal
    - failed_breakout_reversal
    - liquidity_rejection_reversal
    - vwap_reclaim_rejection
    - momentum_scalp
    - exhaustion_reversal
methodology:
  lane_geometry:
    cmp_scalp: {minimum_tp1_reward_to_risk: 1.00, maximum_stop_distance_pct: 2.0, minimum_target_quality: 45.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25, maximum_tp1_distance_atr: 1.50}
    confirmation_scalp: {minimum_tp1_reward_to_risk: 1.00, maximum_stop_distance_pct: 2.0, minimum_target_quality: 45.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25, maximum_tp1_distance_atr: 1.50}
    pullback_scalp: {minimum_tp1_reward_to_risk: 1.20, maximum_stop_distance_pct: 2.5, minimum_target_quality: 50.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25, maximum_tp1_distance_atr: 2.00}
    nearby_structured: {minimum_tp1_reward_to_risk: 1.25, maximum_stop_distance_pct: 6.0, minimum_target_quality: 50.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25, maximum_tp1_distance_atr: 3.00}
    runner: {minimum_tp1_reward_to_risk: 1.80, maximum_stop_distance_pct: 8.0, minimum_target_quality: 60.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25}
    developing: {minimum_tp1_reward_to_risk: 1.25, maximum_stop_distance_pct: 6.0, minimum_target_quality: 50.0, minimum_stop_distance_atr: 0.25, minimum_stop_to_cost_ratio: 1.25}
  execution_quality_caps:
    provisional_evidence: 0.65
    trigger_incomplete: 0.55
    data_stale: 0.25
    data_degraded: 0.50
    outside_entry_zone: 0.60
    chase_limit_violated: 0.20
    stop_infeasible: 0.00
    spread_slippage_unavailable: 0.75
  htf_consequences:
    countertrend_scalp_target_ceiling_r: 1.5
    reversal_attempt_target_ceiling_r: 2.0
    mixed_mild_target_ceiling_r: 2.5
    mixed_constrained_target_ceiling_r: 2.0
  ranking_weights:
    execution_precedence: 0.22
    tp1_reward_quality: 0.20
    target_quality: 0.12
    setup_quality: 0.12
    execution_quality: 0.12
    htf_alignment: 0.08
    timing_quality: 0.05
    data_confidence: 0.04
    overall_trade_quality: 0.05
analysis_timeframes:
  - 1m
  - 3m
  - 5m
  - 15m
  - 30m
  - 1h
  - 4h
timeframe_roles:
  1W: long_term_macro
  3D: swing
  1D: swing
  12h: swing
  8h: macro
  6h: macro
  4h: macro
  2h: intermediate
  1h: intermediate
  30m: intraday
  15m: setup
  5m: entry
  3m: refinement
  1m: timing
timeframe_resampling_sources:
  1W: 4h
  3D: 4h
  1D: 4h
  12h: 4h
  8h: 4h
  6h: 1h
  2h: 1h
timeframe_max_staleness_seconds:
  1m: 180
  3m: 360
  5m: 600
  15m: 1800
  30m: 3600
  1h: 7200
  2h: 14400
  4h: 28800
  6h: 43200
  8h: 57600
  12h: 86400
  1D: 259200
  3D: 604800
  1W: 1209600
timeframe_indicator_profiles:
  timing: {ema_fast: 9, ema_slow: 21, rsi: 9, rsi_slope: 3, roc: 6, macd_fast: 5, macd_slow: 13, macd_signal: 4, atr: 14, relative_volume: 20, range_lookback: 20}
  refinement: {ema_fast: 9, ema_slow: 21, rsi: 9, rsi_slope: 3, roc: 9, macd_fast: 8, macd_slow: 21, macd_signal: 5, atr: 14, relative_volume: 20, range_lookback: 20}
  entry: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  setup: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  intraday: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  intermediate: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  macro: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  swing: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
  long_term_macro: {ema_fast: 20, ema_slow: 50, rsi: 14, rsi_slope: 3, roc: 12, macd_fast: 12, macd_slow: 26, macd_signal: 9, atr: 14, relative_volume: 20, range_lookback: 20}
