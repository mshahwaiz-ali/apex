environment: development
log_level: INFO
data_dir: data
log_dir: logs
cache_enabled: true
advanced_intelligence_enabled: false
intelligence_funding_enabled: false
intelligence_open_interest_enabled: false
intelligence_correlation_enabled: false
gainer_state_thresholds:
  fresh_total_return_pct: 5.0
  fresh_recent_return_pct: 1.0
  fresh_relative_volume: 1.5
  acceleration_total_return_pct: 10.0
  acceleration_recent_return_pct: 3.0
  acceleration_relative_volume: 2.0
  acceleration_range_expansion: 1.5
