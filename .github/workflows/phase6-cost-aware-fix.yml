name: Complete Phase 6 cost-aware risk modeling

on:
  push:
    paths:
      - ".github/workflows/phase6-cost-aware-fix.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Apply focused risk patches
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis_path = Path("src/apex/application/analysis.py")
          analysis = analysis_path.read_text(encoding="utf-8")
          analysis_anchor = '''            "atr_used_by_noise_floor": atr_used_by_noise_floor,
              "rejection_codes": [code.value for code in assessment.rejection_codes],
          '''
          analysis_replacement = '''            "atr_used_by_noise_floor": atr_used_by_noise_floor,
              "configured_risk_amount": configured_risk_amount,
              "configured_entry_fee_percentage": config.entry_fee_pct,
              "configured_exit_fee_percentage": config.exit_fee_pct,
              "configured_entry_slippage_percentage": config.entry_slippage_pct,
              "configured_exit_slippage_percentage": config.exit_slippage_pct,
              "structural_loss_fraction": structural_loss_fraction,
              "execution_cost_fraction": execution_cost_fraction,
              "modeled_total_loss_fraction": modeled_total_loss_fraction,
              "modeled_position_notional": modeled_position_notional,
              "modeled_quantity": modeled_position_notional / entry_price,
              "modeled_structural_loss_amount": (
                  modeled_position_notional * structural_loss_fraction
              ),
              "modeled_execution_cost_amount": (
                  modeled_position_notional * execution_cost_fraction
              ),
              "modeled_total_loss_amount": (
                  modeled_position_notional * modeled_total_loss_fraction
              ),
              "modeled_required_leverage": modeled_required_leverage,
              "rejection_codes": [code.value for code in assessment.rejection_codes],
          '''
          if analysis_anchor not in analysis:
              raise SystemExit("analysis diagnostics anchor not found")
          analysis_path.write_text(
              analysis.replace(analysis_anchor, analysis_replacement, 1),
              encoding="utf-8",
          )

          config_path = Path("src/apex/risk/config.py")
          config = config_path.read_text(encoding="utf-8")
          loader_anchor = '''        "maintenance_margin_pct": futures.execution_costs.maintenance_margin_percentage,
              "maximum_concurrent_trades": policy.maximum_trades_per_day,
          '''
          loader_replacement = '''        "maintenance_margin_pct": futures.execution_costs.maintenance_margin_percentage,
              "entry_fee_pct": futures.execution_costs.entry_fee_percentage,
              "exit_fee_pct": futures.execution_costs.exit_fee_percentage,
              "entry_slippage_pct": futures.execution_costs.entry_slippage_percentage,
              "exit_slippage_pct": futures.execution_costs.exit_slippage_percentage,
              "maximum_concurrent_trades": policy.maximum_trades_per_day,
          '''
          if loader_anchor not in config:
              raise SystemExit("risk loader execution-cost anchor not found")
          config = config.replace(loader_anchor, loader_replacement, 1)

          resolver_anchor = '''        maintenance_margin_pct=(futures.execution_costs.maintenance_margin_percentage),
              maximum_concurrent_trades=policy.maximum_trades_per_day,
          '''
          resolver_replacement = '''        maintenance_margin_pct=(futures.execution_costs.maintenance_margin_percentage),
              entry_fee_pct=futures.execution_costs.entry_fee_percentage,
              exit_fee_pct=futures.execution_costs.exit_fee_percentage,
              entry_slippage_pct=futures.execution_costs.entry_slippage_percentage,
              exit_slippage_pct=futures.execution_costs.exit_slippage_percentage,
              maximum_concurrent_trades=policy.maximum_trades_per_day,
          '''
          if resolver_anchor not in config:
              raise SystemExit("risk resolver execution-cost anchor not found")
          config_path.write_text(
              config.replace(resolver_anchor, resolver_replacement, 1),
              encoding="utf-8",
          )

          test_path = Path("tests/unit/risk/test_phase6_engine.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = tests.replace(
              "from datetime import UTC, datetime\n",
              "from datetime import UTC, datetime\nfrom pathlib import Path\n",
              1,
          )
          tests = tests.replace(
              "    load_risk_config,\n",
              "    load_risk_config,\n    resolve_risk_config_for_mode,\n",
              1,
          )
          tests = tests.replace(
              "from apex.scoring import (\n",
              "from apex.domain.futures import RiskMode\nfrom apex.scoring import (\n",
              1,
          )
          obsolete = '''    modeled_loss = result.setup.position_size.quantity * result.setup.stop_loss.distance
              assert modeled_loss == pytest.approx(50.0)
          '''
          corrected = '''    position = result.setup.position_size
              structural_loss = position.quantity * result.setup.stop_loss.distance
              execution_cost_fraction = (
                  config.entry_fee_pct
                  + config.exit_fee_pct
                  + config.entry_slippage_pct
                  + config.exit_slippage_pct
              ) / 100.0
              execution_costs = position.notional_value * execution_cost_fraction
              assert structural_loss + execution_costs == pytest.approx(position.risk_amount)
          '''
          if obsolete not in tests:
              raise SystemExit("obsolete gross-loss assertion not found")
          tests = tests.replace(obsolete, corrected, 1)

          loader_test_anchor = '''    assert config.maximum_leverage == pytest.approx(5.0)
          '''
          loader_test_replacement = '''    assert config.maximum_leverage == pytest.approx(5.0)
              assert config.entry_fee_pct == pytest.approx(0.04)
              assert config.exit_fee_pct == pytest.approx(0.04)
              assert config.entry_slippage_pct == pytest.approx(0.03)
              assert config.exit_slippage_pct == pytest.approx(0.03)
          '''
          if loader_test_anchor not in tests:
              raise SystemExit("risk loader test anchor not found")
          tests = tests.replace(loader_test_anchor, loader_test_replacement, 1)

          new_test_anchor = '''
          
          def test_risk_config_loader_rejects_unknown_fields(tmp_path) -> None:
          '''
          new_test = '''
          
          def test_loader_and_mode_resolver_use_canonical_execution_costs(tmp_path) -> None:
              futures_text = Path("config/futures.yaml").read_text(encoding="utf-8")
              futures_text = futures_text.replace("entry_fee_percentage: 0.04", "entry_fee_percentage: 0.11")
              futures_text = futures_text.replace("exit_fee_percentage: 0.04", "exit_fee_percentage: 0.12")
              futures_text = futures_text.replace(
                  "entry_slippage_percentage: 0.03",
                  "entry_slippage_percentage: 0.13",
              )
              futures_text = futures_text.replace(
                  "exit_slippage_percentage: 0.03",
                  "exit_slippage_percentage: 0.14",
              )
              futures_path = tmp_path / "futures.yaml"
              futures_path.write_text(futures_text, encoding="utf-8")
          
              loaded = load_risk_config(
                  "config/risk.yaml",
                  futures_config_path=futures_path,
              )
              resolved = resolve_risk_config_for_mode(
                  RiskConfig(),
                  RiskMode.STANDARD,
                  futures_config_path=futures_path,
              )
          
              expected = pytest.approx((0.11, 0.12, 0.13, 0.14))
              assert (
                  loaded.entry_fee_pct,
                  loaded.exit_fee_pct,
                  loaded.entry_slippage_pct,
                  loaded.exit_slippage_pct,
              ) == expected
              assert (
                  resolved.entry_fee_pct,
                  resolved.exit_fee_pct,
                  resolved.entry_slippage_pct,
                  resolved.exit_slippage_pct,
              ) == expected
          
          
          def test_risk_config_loader_rejects_unknown_fields(tmp_path) -> None:
          '''
          if new_test_anchor not in tests:
              raise SystemExit("new canonical-cost test anchor not found")
          test_path.write_text(tests.replace(new_test_anchor, new_test, 1), encoding="utf-8")
          PY

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff format .
          ruff check . --fix
          ruff format --check .
          ruff check .

      - name: Strict typing
        run: mypy

      - name: Full tests
        run: pytest

      - name: Verify focused invariants
        run: |
          python - <<'PY'
          from pathlib import Path

          analysis = Path("src/apex/application/analysis.py").read_text(encoding="utf-8")
          config = Path("src/apex/risk/config.py").read_text(encoding="utf-8")
          tests = Path("tests/unit/risk/test_phase6_engine.py").read_text(encoding="utf-8")

          assert analysis.count('"modeled_required_leverage"') == 1
          assert analysis.count('"modeled_total_loss_amount"') == 1
          assert config.count("entry_fee_pct=futures.execution_costs.entry_fee_percentage") == 1
          assert config.count('"entry_fee_pct": futures.execution_costs.entry_fee_percentage') == 1
          assert "structural_loss + execution_costs" in tests
          assert "modeled_loss == pytest.approx(50.0)" not in tests
          PY

      - name: Commit validated changes to main
        run: |
          rm .github/workflows/phase6-cost-aware-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: complete cost-aware Phase 6 risk modeling"
          git push origin HEAD:main

# Trigger registered workflow.
